name: Build Android Installer APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Restore debug keystore
        run: base64 -d debug.keystore.base64 > debug.keystore

      - name: Create empty .env if absent
        run: touch .env

      - name: Run Unit & Robolectric Tests
        run: gradle :app:testDebugUnitTest

      - name: Build Debug Installer APK
        run: gradle :app:assembleDebug

      - name: Upload Installer APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cadence-v1.0-apk
          path: app/build/outputs/apk/debug/app-debug.apk
